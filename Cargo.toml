[package]
name = "chest-counter"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Counts the chests you open in Fortnite from the game's replay files"

[dependencies]
aes = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.6"
ureq = "2"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
